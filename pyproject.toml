[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aed-boredom-agi"
version = "0.1.0"
description = "Reproducible tabular experiments for an aversive epistemic drive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["aed*", "analysis*", "experiments*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
