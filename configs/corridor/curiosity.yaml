method: curiosity
environment: stochastic_corridor
seed: 0
steps: 3000

agent:
  learning_rate: 0.2
  discount_factor: 0.95
  # Curiosity has no boredom-driven escape; a very small epsilon makes the
  # stochastic-trap residence visible over the default finite horizon.
  epsilon: 0.001

curiosity:
  prediction_error_scale: 2.5

environment_config:
  tv_vocab: 8
  puzzle_mastery_steps: 5
  puzzle_reward: 1.0
